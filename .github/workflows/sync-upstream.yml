name: Sync Upstream Repository

on:
  schedule:
    # Executa diariamente às 2:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/k1tbyte/Wand-Enhancer.git
          git fetch upstream master

      - name: Merge upstream changes
        continue-on-error: true
        run: |
          git merge upstream/master -m "Sync with upstream repository"

      - name: Restore build.yml customization
        run: |
          # Resolve conflitos no build.yml mantendo nossa versão
          if git diff --name-only --diff-filter=U | grep -q ".github/workflows/build.yml"; then
            git checkout --ours .github/workflows/build.yml
            git add .github/workflows/build.yml
          fi

          # Garante que enable_update_notifications.default = true
          if [ -f ".github/workflows/build.yml" ]; then
            sed -i 's/default: false/default: true/' .github/workflows/build.yml
            
            # Verifica se houve mudança e faz commit se necessário
            if ! git diff --quiet .github/workflows/build.yml; then
              git add .github/workflows/build.yml
              git commit -m "Maintain build.yml customization: enable_update_notifications.default = true" || true
            fi
          fi

      - name: Push changes
        run: |
          git push origin master || echo "Repository already up to date"

      - name: Create Pull Request if changes exist
        if: failure() == false
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Sync with upstream repository"
          title: "Sync: Upstream changes from k1tbyte/Wand-Enhancer"
          body: |
            ## Sincronização com repositório upstream
            
            Esta PR sincroniza as alterações mais recentes do repositório original (k1tbyte/Wand-Enhancer).
            
            ### Customização mantida:
            - `build.yml`: `enable_update_notifications.default = true`
          branch: sync-upstream
          delete-branch: true
